name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_DB: llm_gateway
          POSTGRES_USER: gateway
          POSTGRES_PASSWORD: gateway-dev-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gateway -d llm_gateway"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://gateway:gateway-dev-only@127.0.0.1:5432/llm_gateway?sslmode=disable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - run: sh -n deploy/gcp/release.sh
      - run: terraform -chdir=infra/gcp fmt -check
      - run: terraform -chdir=infra/gcp init -backend=false -input=false
      - run: terraform -chdir=infra/gcp validate
      - run: make test
      - run: make test-race
      - run: make vet
      - run: make build
      - run: make test-integration
