steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "service", "--build-arg", "SERVICE=llm-gateway", "--build-arg", "SOURCE_REVISION=${_SOURCE_REVISION}", "--tag", "${_REPOSITORY}/gateway:${_SOURCE_REVISION}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "service", "--build-arg", "SERVICE=control-plane", "--build-arg", "SOURCE_REVISION=${_SOURCE_REVISION}", "--tag", "${_REPOSITORY}/control-plane:${_SOURCE_REVISION}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "service", "--build-arg", "SERVICE=metering", "--build-arg", "SOURCE_REVISION=${_SOURCE_REVISION}", "--tag", "${_REPOSITORY}/metering:${_SOURCE_REVISION}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "service", "--build-arg", "SERVICE=schema-migrate", "--build-arg", "SOURCE_REVISION=${_SOURCE_REVISION}", "--tag", "${_REPOSITORY}/schema-migrate:${_SOURCE_REVISION}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "service", "--build-arg", "SERVICE=provider-bootstrap", "--build-arg", "SOURCE_REVISION=${_SOURCE_REVISION}", "--tag", "${_REPOSITORY}/provider-bootstrap:${_SOURCE_REVISION}", "."]
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--target", "role-config", "--tag", "${_REPOSITORY}/role-config:${_SOURCE_REVISION}", "."]
images:
  - "${_REPOSITORY}/gateway:${_SOURCE_REVISION}"
  - "${_REPOSITORY}/control-plane:${_SOURCE_REVISION}"
  - "${_REPOSITORY}/metering:${_SOURCE_REVISION}"
  - "${_REPOSITORY}/schema-migrate:${_SOURCE_REVISION}"
  - "${_REPOSITORY}/provider-bootstrap:${_SOURCE_REVISION}"
  - "${_REPOSITORY}/role-config:${_SOURCE_REVISION}"
options:
  logging: CLOUD_LOGGING_ONLY
