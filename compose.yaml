services:
  postgres:
    image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    environment:
      POSTGRES_DB: llm_gateway
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway-dev-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d llm_gateway"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "55433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql

  gateway:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gateway:gateway-dev-only@postgres:5432/llm_gateway?sslmode=disable
      GATEWAY_MIGRATE: "true"
      GATEWAY_ACCESS_PROJECTION: "true"
      GATEWAY_DEV_ECHO: "true"
      GATEWAY_API_KEY_PEPPER: "gateway-local-pepper-change-me"
      GATEWAY_BOOTSTRAP_ACCESS: "true"
      GATEWAY_API_KEYS_JSON: '{"dev-token-llm-gateway-local":"tenant-dev"}'
      GATEWAY_TENANT_HOME_REGIONS_JSON: '{"tenant-dev":"local"}'
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/service", "healthcheck"]
      interval: 5s
      timeout: 2s
      retries: 10

volumes:
  postgres-data:
